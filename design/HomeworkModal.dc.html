<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    a { color: #1B4F91; } a:hover { color: #123a6e; }
  </style>
</helmet>
<div style="width:390px; height:844px; background:rgba(16,20,26,0.45); display:flex; flex-direction:column; justify-content:flex-end; overflow:hidden; position:relative;">

  <div style="background:#F5F6F8; border-radius:20px 20px 0 0; display:flex; flex-direction:column; max-height:640px;">

    <!-- grab handle -->
    <div style="display:flex; justify-content:center; padding:10px 0 4px 0;">
      <div style="width:36px; height:4px; border-radius:2px; background:#D3D8DE;"></div>
    </div>

    <!-- header -->
    <div style="padding:6px 16px 14px 16px; display:flex; align-items:center; justify-content:space-between;">
      <div style="font-size:17px; font-weight:700; color:#16181C;">Новое задание</div>
      <div style="width:28px; height:28px; border-radius:14px; background:#E9EBEE; display:flex; align-items:center; justify-content:center;">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#7B8794" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18M6 6l12 12"/></svg>
      </div>
    </div>

    <div style="padding:0 16px 20px 16px; display:flex; flex-direction:column; gap:16px;">

      <!-- subject -->
      <div style="display:flex; flex-direction:column; gap:7px;">
        <div style="font-size:12.5px; font-weight:600; color:#7B8794; text-transform:uppercase; letter-spacing:0.3px;">Предмет</div>
        <div style="padding:13px 14px; background:#FFFFFF; border:1px solid #E7E9EC; border-radius:13px; display:flex; align-items:center; justify-content:space-between;">
          <div style="font-size:15px; color:#16181C; font-weight:500;">Программирование</div>
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#9AA5B1" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg>
        </div>
      </div>

      <!-- group -->
      <div style="display:flex; flex-direction:column; gap:7px;">
        <div style="font-size:12.5px; font-weight:600; color:#7B8794; text-transform:uppercase; letter-spacing:0.3px;">Группа</div>
        <div style="padding:13px 14px; background:#F0F2F5; border:1px solid #E7E9EC; border-radius:13px; display:flex; align-items:center; justify-content:space-between;">
          <div style="font-size:15px; color:#516175; font-weight:500;">10702219 (ваша группа)</div>
        </div>
      </div>

      <!-- deadline -->
      <div style="display:flex; flex-direction:column; gap:7px;">
        <div style="font-size:12.5px; font-weight:600; color:#7B8794; text-transform:uppercase; letter-spacing:0.3px;">Срок сдачи</div>
        <div style="padding:13px 14px; background:#FFFFFF; border:1px solid #E7E9EC; border-radius:13px; display:flex; align-items:center; justify-content:space-between;">
          <div style="font-size:15px; color:#16181C; font-weight:500;">18 сентября, четверг</div>
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#9AA5B1" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="3"/><path d="M3 10h18M8 2v4M16 2v4"/></svg>
        </div>
      </div>

      <!-- text -->
      <div style="display:flex; flex-direction:column; gap:7px;">
        <div style="font-size:12.5px; font-weight:600; color:#7B8794; text-transform:uppercase; letter-spacing:0.3px;">Описание задания</div>
        <div style="padding:13px 14px; background:#FFFFFF; border:1px solid #E7E9EC; border-radius:13px; min-height:88px;">
          <div style="font-size:15px; color:#16181C; line-height:1.5;">Завершить лабораторную работу №2: реализовать сортировку слиянием, подготовить отчёт в PDF.</div>
        </div>
      </div>

    </div>

    <!-- save button -->
    <div style="padding:4px 16px 24px 16px;">
      <div style="width:100%; padding:15px; background:#1B4F91; color:#fff; border-radius:14px; text-align:center; font-size:16px; font-weight:600;">Сохранить задание</div>
    </div>

  </div>
</div>
</x-dc>
</body>
</html>
