<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
  </style>
</helmet>
<div style="width:390px; background:#F5F6F8; padding:20px 16px; display:flex; flex-direction:column; gap:14px;">

  <div style="font-size:12px; font-weight:600; color:#7B8794; text-transform:uppercase; letter-spacing:0.4px;">Компонент · нижняя навигация (общая для всех ролей)</div>

  <!-- state: student/starosta -->
  <div style="display:flex; flex-direction:column; gap:6px;">
    <div style="font-size:12px; color:#9AA5B1;">Студент / Староста</div>
    <div style="display:flex; background:#FFFFFF; border-radius:16px; border:1px solid #EEF0F2; padding:8px 8px 12px 8px;">
      <div style="flex:1; display:flex; flex-direction:column; align-items:center; gap:3px; color:#1B4F91;">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#1B4F91" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2Z"/></svg>
        <div style="font-size:11px; font-weight:600;">Дневник</div>
      </div>
      <div style="flex:1; display:flex; flex-direction:column; align-items:center; gap:3px; color:#9AA5B1;">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#9AA5B1" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="3"/><path d="M3 10h18M8 2v4M16 2v4"/></svg>
        <div style="font-size:11px;">Расписание</div>
      </div>
      <div style="flex:1; display:flex; flex-direction:column; align-items:center; gap:3px; color:#9AA5B1;">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#9AA5B1" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3v18h18"/><path d="M7 15l4-5 3 3 5-7"/></svg>
        <div style="font-size:11px;">Оценки</div>
      </div>
      <div style="flex:1; display:flex; flex-direction:column; align-items:center; gap:3px; color:#9AA5B1;">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#9AA5B1" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 3.6-7 8-7s8 3 8 7"/></svg>
        <div style="font-size:11px;">Профиль</div>
      </div>
    </div>
  </div>

  <!-- state: teacher -->
  <div style="display:flex; flex-direction:column; gap:6px;">
    <div style="font-size:12px; color:#9AA5B1;">Преподаватель — вкладка «Оценки» заменена на «Группы»</div>
    <div style="display:flex; background:#FFFFFF; border-radius:16px; border:1px solid #EEF0F2; padding:8px 8px 12px 8px;">
      <div style="flex:1; display:flex; flex-direction:column; align-items:center; gap:3px; color:#1B4F91;">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#1B4F91" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2Z"/></svg>
        <div style="font-size:11px; font-weight:600;">Журнал</div>
      </div>
      <div style="flex:1; display:flex; flex-direction:column; align-items:center; gap:3px; color:#9AA5B1;">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#9AA5B1" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="3"/><path d="M3 10h18M8 2v4M16 2v4"/></svg>
        <div style="font-size:11px;">Расписание</div>
      </div>
      <div style="flex:1; display:flex; flex-direction:column; align-items:center; gap:3px; color:#9AA5B1;">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#9AA5B1" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M19 8v6M22 11h-6"/></svg>
        <div style="font-size:11px;">Группы</div>
      </div>
      <div style="flex:1; display:flex; flex-direction:column; align-items:center; gap:3px; color:#9AA5B1;">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#9AA5B1" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 3.6-7 8-7s8 3 8 7"/></svg>
        <div style="font-size:11px;">Профиль</div>
      </div>
    </div>
  </div>

  <!-- grade legend -->
  <div style="display:flex; flex-direction:column; gap:6px; margin-top:6px;">
    <div style="font-size:12px; color:#9AA5B1;">Легенда 10-балльной шкалы</div>
    <div style="display:flex; background:#FFFFFF; border-radius:16px; border:1px solid #EEF0F2; padding:14px; gap:10px; flex-wrap:wrap;">
      <div style="display:flex; align-items:center; gap:6px;">
        <div style="width:22px; height:22px; border-radius:7px; background:#E6F7ED; color:#2FAE60; font-size:11px; font-weight:700; display:flex; align-items:center; justify-content:center;">9</div>
        <div style="font-size:12px; color:#516175;">9–10 отлично</div>
      </div>
      <div style="display:flex; align-items:center; gap:6px;">
        <div style="width:22px; height:22px; border-radius:7px; background:#EAF1FB; color:#1B4F91; font-size:11px; font-weight:700; display:flex; align-items:center; justify-content:center;">7</div>
        <div style="font-size:12px; color:#516175;">7–8 хорошо</div>
      </div>
      <div style="display:flex; align-items:center; gap:6px;">
        <div style="width:22px; height:22px; border-radius:7px; background:#FDF3E3; color:#E8A33D; font-size:11px; font-weight:700; display:flex; align-items:center; justify-content:center;">5</div>
        <div style="font-size:12px; color:#516175;">5–6 удовл.</div>
      </div>
      <div style="display:flex; align-items:center; gap:6px;">
        <div style="width:22px; height:22px; border-radius:7px; background:#FBE7EA; color:#C8102E; font-size:11px; font-weight:700; display:flex; align-items:center; justify-content:center;">3</div>
        <div style="font-size:12px; color:#516175;">1–4 неуд.</div>
      </div>
      <div style="display:flex; align-items:center; gap:6px;">
        <div style="width:22px; height:22px; border-radius:7px; background:#EEF0F2; color:#9AA5B1; font-size:10px; font-weight:700; display:flex; align-items:center; justify-content:center;">н</div>
        <div style="font-size:12px; color:#516175;">не явился</div>
      </div>
    </div>
  </div>

</div>
</x-dc>
</body>
</html>
