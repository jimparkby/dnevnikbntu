<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    a { color: #1B4F91; } a:hover { color: #123a6e; }
  </style>
</helmet>
<div style="width:390px; height:844px; background:rgba(16,20,26,0.45); display:flex; flex-direction:column; justify-content:flex-end; overflow:hidden; position:relative;">

  <div style="background:#F5F6F8; border-radius:20px 20px 0 0; display:flex; flex-direction:column;">

    <div style="display:flex; justify-content:center; padding:10px 0 4px 0;">
      <div style="width:36px; height:4px; border-radius:2px; background:#D3D8DE;"></div>
    </div>

    <div style="padding:6px 16px 4px 16px; display:flex; align-items:center; justify-content:space-between;">
      <div style="display:flex; flex-direction:column; gap:1px;">
        <div style="font-size:17px; font-weight:700; color:#16181C;">Выставить оценку</div>
        <div style="font-size:13px; color:#7B8794;">Мельник С. · Программирование</div>
      </div>
      <div style="width:28px; height:28px; border-radius:14px; background:#E9EBEE; display:flex; align-items:center; justify-content:center;">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#7B8794" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18M6 6l12 12"/></svg>
      </div>
    </div>

    <div style="padding:14px 16px 20px 16px; display:flex; flex-direction:column; gap:18px;">

      <!-- date -->
      <div style="display:flex; flex-direction:column; gap:7px;">
        <div style="font-size:12.5px; font-weight:600; color:#7B8794; text-transform:uppercase; letter-spacing:0.3px;">Дата занятия</div>
        <div style="padding:13px 14px; background:#FFFFFF; border:1px solid #E7E9EC; border-radius:13px; display:flex; align-items:center; justify-content:space-between;">
          <div style="font-size:15px; color:#16181C; font-weight:500;">15 сентября, понедельник</div>
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#9AA5B1" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="3"/><path d="M3 10h18M8 2v4M16 2v4"/></svg>
        </div>
      </div>

      <!-- work type -->
      <div style="display:flex; flex-direction:column; gap:7px;">
        <div style="font-size:12.5px; font-weight:600; color:#7B8794; text-transform:uppercase; letter-spacing:0.3px;">Тип работы</div>
        <div style="display:flex; gap:7px;">
          <div style="flex:1; text-align:center; padding:9px 0; background:#FFFFFF; border:1px solid #E7E9EC; border-radius:10px; font-size:12.5px; color:#516175; font-weight:500;">Текущая</div>
          <div style="flex:1; text-align:center; padding:9px 0; background:#1B4F91; border-radius:10px; font-size:12.5px; color:#fff; font-weight:600;">Контрольная</div>
          <div style="flex:1; text-align:center; padding:9px 0; background:#FFFFFF; border:1px solid #E7E9EC; border-radius:10px; font-size:12.5px; color:#516175; font-weight:500;">ДЗ</div>
        </div>
      </div>

      <!-- grade scale 1-10 -->
      <div style="display:flex; flex-direction:column; gap:7px;">
        <div style="font-size:12.5px; font-weight:600; color:#7B8794; text-transform:uppercase; letter-spacing:0.3px;">Оценка (10-балльная шкала)</div>
        <div style="display:flex; gap:6px; flex-wrap:wrap;">
          <div style="width:40px; height:44px; border-radius:11px; background:#FFFFFF; border:1px solid #E7E9EC; display:flex; align-items:center; justify-content:center; font-size:15px; font-weight:600; color:#C8102E;">1</div>
          <div style="width:40px; height:44px; border-radius:11px; background:#FFFFFF; border:1px solid #E7E9EC; display:flex; align-items:center; justify-content:center; font-size:15px; font-weight:600; color:#C8102E;">2</div>
          <div style="width:40px; height:44px; border-radius:11px; background:#FFFFFF; border:1px solid #E7E9EC; display:flex; align-items:center; justify-content:center; font-size:15px; font-weight:600; color:#C8102E;">3</div>
          <div style="width:40px; height:44px; border-radius:11px; background:#FFFFFF; border:1px solid #E7E9EC; display:flex; align-items:center; justify-content:center; font-size:15px; font-weight:600; color:#C8102E;">4</div>
          <div style="width:40px; height:44px; border-radius:11px; background:#FFFFFF; border:1px solid #E7E9EC; display:flex; align-items:center; justify-content:center; font-size:15px; font-weight:600; color:#E8A33D;">5</div>
          <div style="width:40px; height:44px; border-radius:11px; background:#FFFFFF; border:1px solid #E7E9EC; display:flex; align-items:center; justify-content:center; font-size:15px; font-weight:600; color:#E8A33D;">6</div>
          <div style="width:40px; height:44px; border-radius:11px; background:#1B4F91; border:1px solid #1B4F91; display:flex; align-items:center; justify-content:center; font-size:16px; font-weight:700; color:#fff; box-shadow:0 3px 8px rgba(27,79,145,0.3);">7</div>
          <div style="width:40px; height:44px; border-radius:11px; background:#FFFFFF; border:1px solid #E7E9EC; display:flex; align-items:center; justify-content:center; font-size:15px; font-weight:600; color:#1B4F91;">8</div>
          <div style="width:40px; height:44px; border-radius:11px; background:#FFFFFF; border:1px solid #E7E9EC; display:flex; align-items:center; justify-content:center; font-size:15px; font-weight:600; color:#2FAE60;">9</div>
          <div style="width:40px; height:44px; border-radius:11px; background:#FFFFFF; border:1px solid #E7E9EC; display:flex; align-items:center; justify-content:center; font-size:15px; font-weight:600; color:#2FAE60;">10</div>
        </div>
      </div>

      <!-- comment -->
      <div style="display:flex; flex-direction:column; gap:7px;">
        <div style="font-size:12.5px; font-weight:600; color:#7B8794; text-transform:uppercase; letter-spacing:0.3px;">Комментарий (необязательно)</div>
        <div style="padding:13px 14px; background:#FFFFFF; border:1px solid #E7E9EC; border-radius:13px; min-height:52px;">
          <div style="font-size:14px; color:#B4BCC4;">Например: не сдал вовремя</div>
        </div>
      </div>

    </div>

    <div style="padding:4px 16px 24px 16px;">
      <div style="width:100%; padding:15px; background:#1B4F91; color:#fff; border-radius:14px; text-align:center; font-size:16px; font-weight:600;">Выставить оценку 7</div>
    </div>

  </div>
</div>
</x-dc>
</body>
</html>
